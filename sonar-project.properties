sonar.projectKey=Dafafi63f_SMO-Bingo
sonar.organization=dafafi63f
sonar.projectName=SMO-Bingo

# Deben coincidir con el proyecto importado en https://sonarcloud.io
# y con el secreto SONAR_TOKEN en GitHub (Settings → Secrets → Actions).

sonar.sources=Files
sonar.tests=Tests
sonar.python.version=3.12

sonar.exclusions=**/__pycache__/**,Bingos/**,Catalog/**
sonar.test.exclusions=**/__pycache__/**

# Repo de scripts/catálogo: el Quality Gate "Sonar way" exige ≥80% coverage
# en new code; los tests cubren helpers, no todo Files/. Sin informe = 0%.
# Excluimos coverage del QG; quitar esta línea si se quiere medir coverage real.
sonar.coverage.exclusions=**/*

# S2083 FP: taint desde lectura/escritura de catálogos locales (no hay HTTP).
# S8544 FP: el parser de GitHub Actions trata ":all:" como paquete sin versión.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e1.resourceKey=**/catalog_lib.py
sonar.issue.ignore.multicriteria.e2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/.github/workflows/tests.yml
sonar.issue.ignore.multicriteria.e3.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e3.resourceKey=**/apply_progression_accessibility.py
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e4.resourceKey=**/export_combined_meta.py
