# SMO Bingo — CI

name: Tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: ${{ github.workspace }}/Files

jobs:
  pre-commits:
    name: Pre-Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Pre-Commits
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  unit-tests:
    name: Unit + integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Run tests
        run: python -m unittest discover -s Tests -t . -v

  mypy:
    name: Run MyPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: pip install --only-binary=:all: -r requirements-dev.txt

      - name: Run MyPy
        run: mypy .

  tests-summary:
    name: tests-summary
    runs-on: ubuntu-latest
    needs: [pre-commits, unit-tests, mypy]
    if: always()
    steps:
      - name: Aggregate test results
        run: |
          {
            echo "## Resumen CI"
            echo ""
            echo "| Job | Resultado |"
            echo "|-----|-----------|"
            echo "| Pre-Commits | ${{ needs.pre-commits.result }} |"
            echo "| Unit + integrity | ${{ needs.unit-tests.result }} |"
            echo "| Run MyPy | ${{ needs.mypy.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.pre-commits.result }}" != "success" ]] \
            || [[ "${{ needs.unit-tests.result }}" != "success" ]] \
            || [[ "${{ needs.mypy.result }}" != "success" ]]; then
            echo "Algún job de Tests ha fallado."
            exit 1
          fi
