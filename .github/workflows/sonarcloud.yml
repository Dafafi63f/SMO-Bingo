name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    env:
      # secrets no se puede usar en if de job; se copia a env y se comprueba en steps.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip if no SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN no configurado en Secrets de Actions."
          echo "Si usas Automatic Analysis de SonarCloud, este job puede omitirse."
          echo "Para análisis vía CI: Settings → Secrets → Actions → SONAR_TOKEN."

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No fallar el job solo por Quality Gate; el check de SonarCloud ya lo reporta.
          args: >-
            -Dsonar.qualitygate.wait=false
