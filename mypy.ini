[mypy]
python_version = 3.12
mypy_path = Files
warn_return_any = False
warn_unused_ignores = False
ignore_missing_imports = True
check_untyped_defs = False
disallow_untyped_defs = False
exclude = (?x)(
    ^Bingos/
    |^Catalog/
    )

# Scripts de export/sync densos: tipado progresivo (como el TFG).
[mypy-export_combined_meta]
ignore_errors = True

[mypy-export_capturas_lunas]
ignore_errors = True

[mypy-export_goals_referencia]
ignore_errors = True

[mypy-export_lunas_tags]
ignore_errors = True

[mypy-sync_objective_moon_groups]
ignore_errors = True

[mypy-fill_captures_cappy]
ignore_errors = True

[mypy-rebuild_sub_area_bingo]
ignore_errors = True

[mypy-apply_progression_accessibility]
ignore_errors = True

[mypy-goal_list_lib]
ignore_errors = True

[mypy-fix_bingo_group_ranges]
ignore_errors = True

[mypy-catalog_lib]
ignore_errors = True

[mypy-export_goals_individuales]
ignore_errors = True

[mypy-export_zonas_reino]
ignore_errors = True
